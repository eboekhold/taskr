name: Integration Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  integration:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install .NET Dependencies
      run: dotnet restore TaskrApi.Testing/Integration

    - name: Build .NET Solution
      run: dotnet build TaskrApi.Testing/Integration --configuration Release --no-restore

    - name: Run Integration Tests
      run: >
        dotnet test
        --project TaskrApi.Testing/Integration/Integration.csproj
        --configuration Release
        --no-build
