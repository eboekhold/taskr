name: Frontend Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
  
    - name: Install Angular Dependencies
      working-directory: ./TaskrClient
      run: npm ci

    - name: Run Angular Tests
      working-directory: ./TaskrClient
      run: npx ng test --watch=false --progress=false

    - name: Test that the Angular app can build
      working-directory: ./TaskrClient
      run: npx ng build
